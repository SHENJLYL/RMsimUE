[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rm-vehicle-tools"
version = "0.1.0"
description = "Validate portable RoboMaster vehicle packages and export restricted URDF"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4"]

[project.scripts]
rm-vehicle = "rm_vehicle_tools.__main__:main"
rm-map = "rm_map_tools.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rm_vehicle_tools*", "rm_map_tools*"]
