[workspace]
name = "rm-simulator-ros2-humble"
version = "0.1.0"
channels = ["https://prefix.dev/robostack-humble", "conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "*"
ros-humble-rclpy = "*"
ros-humble-rclcpp = "*"
ros-humble-rosidl-default-generators = "*"
eigen = "*"
cmake = "*"
ninja = "*"
ros-humble-std-msgs = "*"
ros-humble-sensor-msgs = "*"
ros-humble-geometry-msgs = "*"
ros-humble-nav-msgs = "*"
ros-humble-rosgraph-msgs = "*"
ros-humble-tf2-msgs = "*"
ros-humble-ros2cli = "*"
ros-humble-ros2topic = "*"
ros-humble-ros2run = "*"
ros-humble-rmw-fastrtps-cpp = "*"
colcon-common-extensions = "*"
pcl = ">=1.15.1,<2"
ros-humble-pcl-conversions = ">=2.4.5,<3"
ros-humble-tf2-ros = ">=0.25.24,<0.26"
ros-humble-visualization-msgs = ">=4.9.2,<5"
ros-humble-nav2-amcl = ">=1.1.20,<2"
ros-humble-nav2-map-server = ">=1.1.20,<2"
ros-humble-nav2-lifecycle-manager = ">=1.1.20,<2"
ros-humble-nav2-controller = ">=1.1.20,<2"
ros-humble-nav2-planner = ">=1.1.20,<2"
ros-humble-nav2-theta-star-planner = ">=1.1.20,<2"
ros-humble-nav2-smoother = ">=1.1.20,<2"
ros-humble-nav2-behaviors = ">=1.1.20,<2"
ros-humble-nav2-bt-navigator = ">=1.1.20,<2"
ros-humble-nav2-waypoint-follower = ">=1.1.20,<2"
ros-humble-nav2-velocity-smoother = ">=1.1.20,<2"
ros-humble-nav2-common = ">=1.1.20,<2"
ros-humble-pcl-ros = ">=2.4.5,<3"
ros-humble-tf2-geometry-msgs = ">=0.25.24,<0.26"
ros-humble-example-interfaces = ">=0.9.3,<0.10"
ros-humble-rclcpp-components = ">=16.0.21,<17"
ros-humble-ament-cmake-auto = ">=1.3.14,<2"
ros-humble-ros2launch = ">=0.19.14,<0.20"
ros-humble-rviz2 = ">=11.2.29,<12"
ros-humble-nav2-rviz-plugins = ">=1.1.20,<2"

[activation.env]
ROS_DISTRO = "humble"
RMW_IMPLEMENTATION = "rmw_fastrtps_cpp"
ROS_DOMAIN_ID = "71"
ROS_LOCALHOST_ONLY = "1"
ROS_LOG_DIR = "E:/simulator-cache/ros-logs"
